[package]
name = "emup-studio"
version = "0.1.0"
description = "MOD-EMUP / ALL-03 universal programmer, over USB"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
strip = true
lto = true
